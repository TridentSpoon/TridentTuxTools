name: AppImage
on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
      - name: Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y python3-venv python3-gi gir1.2-gtk-4.0 gir1.2-adw-1 xvfb libgl1 libegl1 desktop-file-utils
          python3 -m venv --system-site-packages .venv
          .venv/bin/pip install pyinstaller==6.22.3
      - name: Tests and build
        run: |
          source .venv/bin/activate
          python3 -m unittest discover -s tests -q
          bash packaging/build-appimage.sh
          desktop-file-validate build/TuxTools.AppDir/*.desktop
          APPIMAGE_EXTRACT_AND_RUN=1 dist/*.AppImage --version
          APPIMAGE_EXTRACT_AND_RUN=1 GSK_RENDERER=cairo xvfb-run -a dist/*.AppImage --smoke-test
      - uses: actions/upload-artifact@v4
        with:
          name: TuxTools-AppImage-x86_64
          path: |
            dist/*.AppImage
            dist/SHA256SUMS
  release:
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: TuxTools-AppImage-x86_64
          path: dist
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/* --repo "$GITHUB_REPOSITORY" --generate-notes
